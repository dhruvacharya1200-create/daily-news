name: Update Daily News

on:
  schedule:
    # 3:30 UTC = 9:00 AM IST, every day
    - cron: '30 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest headlines
        run: node fetch-news.mjs

      - name: Commit and push if news.json changed
        run: |
          git config user.name "daily-bulletin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Daily update: $(date -u +'%Y-%m-%d')"
          git push
